<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SkyFlow - A premium real-time weather dashboard featuring search autocomplete, hourly charts, and detailed metrics.">
    <title>SkyFlow - Premium Weather Dashboard</title>
    
    <!-- Bootstrap 5 CSS for base utilities -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Dashboard Header -->
        <header class="glass-panel py-3 px-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="brand-section">
                <span class="brand-icon">🌦️</span>
                <h1 class="brand-title m-0">SkyFlow</h1>
            </div>
            
            <!-- Dynamic Autocomplete Search Engine -->
            <div class="search-container">
                <div class="search-wrapper">
                    <span class="search-icon-left"><i data-lucide="search"></i></span>
                    <input type="text" id="search-input" class="search-input" placeholder="Search for cities worldwide..." autocomplete="off">
                </div>
                <ul id="search-dropdown" class="autocomplete-dropdown"></ul>
            </div>
            
            <!-- Controls Group -->
            <div class="controls-section">
                <button id="btn-locate" class="btn-icon" title="Locate Me">
                    <i data-lucide="map-pin"></i>
                </button>
                <div class="unit-toggle">
                    <button id="unit-celsius" class="unit-btn active">°C</button>
                    <button id="unit-fahrenheit" class="unit-btn">°F</button>
                </div>
            </div>
        </header>

        <!-- Quick Access Recent Searches -->
        <div class="d-flex align-items-center gap-3 flex-wrap">
            <span class="text-secondary" style="font-size: 0.9rem; font-weight: 500;">Recent:</span>
            <div id="recent-searches-content" class="d-flex gap-2 flex-wrap">
                <!-- Dynamic Quick Tags -->
            </div>
        </div>

        <!-- Main Dashboard Content Grid -->
        <main class="dashboard-grid">
            <!-- Sidebar Panel: Current Weather Status -->
            <section class="glass-panel current-weather-panel" id="current-weather-content">
                <!-- Skeleton/Content populated dynamically -->
            </section>

            <!-- Details Section: Metrics, Hourly Chart, Weekly Forecast -->
            <section class="details-section">
                <!-- 6-Card Grid of Detailed Weather Metrics -->
                <div class="metrics-grid" id="metrics-grid-content">
                    <!-- Populated dynamically -->
                </div>

                <!-- Interactive Hourly Chart Graph Panel -->
                <div class="glass-panel">
                    <div class="chart-title-bar">
                        <h3 class="m-0" style="font-size: 1.25rem;">Hourly Forecast</h3>
                        <span class="text-secondary" style="font-size: 0.85rem;">Next 24 Hours</span>
                    </div>
                    <div class="chart-panel">
                        <canvas id="hourly-chart"></canvas>
                    </div>
                </div>

                <!-- 7-Day Forecast Card -->
                <div class="glass-panel">
                    <h3 class="mb-4" style="font-size: 1.25rem;">7-Day Forecast</h3>
                    <div class="daily-forecast-container" id="daily-forecast-content">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Chart.js and Lucide Icon Library CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Core Application Logic -->
    <script src="script.js"></script>
</body>
</html>
